      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }

    }
    .animate-fade-in {
      animation: fadeIn 0.28s ease-out both;

      <div class="flex items-center gap-2.5 min-w-0">
        <div class="grid grid-cols-2 gap-0.5 w-7 h-7 p-1 bg-slate-900 rounded-xl shrink-0 shadow-inner">

          <span class="bg-red-500 rounded-sm"></span>
          <span class="bg-green-500 rounded-sm"></span>
          <span class="bg-amber-400 rounded-sm"></span>

          <p id="sync-status-badge" class="text-[10px] font-semibold text-emerald-600 flex items-center gap-1 truncate">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="sync-status-text">Synchronisation en direct</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <div class="inline-flex bg-slate-100 p-0.5 rounded-xl border border-slate-200/70">
          <button

            onclick="window.app.switchMainTab('quiz')"
            class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-slate-900 shadow-sm"
          >
            <span id="nav-quiz-label">Questionnaire</span>
          </button>
          <button
            id="tab-btn-team"
            onclick="window.app.switchMainTab('team')"

            <span id="nav-team-label">Équipe</span>
            <span id="nav-team-count" class="px-1.5 py-0.2 bg-slate-900 text-white text-[10px] font-extrabold rounded-full">0</span>
          </button>
        </div>

        <!-- FR / EN Toggle -->
        <div class="inline-flex border border-slate-200 rounded-xl p-0.5 bg-white">
          <button
            id="lang-btn-fr"
            onclick="window.app.setLanguage('fr')"
            class="px-2 py-1 rounded-lg text-xs font-extrabold transition-all bg-slate-900 text-white"
          >
            FR
          </button>
          <button
            id="lang-btn-en"
            onclick="window.app.setLanguage('en')"
            class="px-2 py-1 rounded-lg text-xs font-extrabold transition-all text-slate-500 hover:text-slate-900"
          >
            EN
          </button>
        </div>

    // =========================================================
    // 5. EVALUATION FUNCTION (Internal Scoring)
    // =========================================================
    function evaluateDISC(answersObj) {
      const scores = { BLEU: 0, ROUGE: 0, VERT: 0, JAUNE: 0 };
      for (let q = 1; q <= 25; q++) {
        const letter = String(answersObj[q] || '').toLowerCase();
        const color = SCORING_MAP[q]?.[letter];
        if (color && scores[color] !== undefined) {
          scores[color] += 1;
        }
      }
      const sortedColors = [...COLOR_ORDER].sort((a, b) => scores[b] - scores[a]);
      return {
        scores,
        sortedColors,
        dominantColor: sortedColors[0],
        secondaryColor: sortedColors[1]
      };
    }

    function parseAnswers(raw) {
      if (!raw) return {};
      if (typeof raw === 'object') return raw;
      try {
        return JSON.parse(raw);
      } catch {
        return {};
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================
    // 5b. TIE HELPERS (dominant / secondary can be shared)
    // =========================================================
    function getTopColors(scores) {
      const val = (c) => Number(scores?.[c] ?? 0);
      const max = Math.max(...COLOR_ORDER.map(val));
      return COLOR_ORDER.filter((c) => val(c) === max);
    }

    function getSecondColors(scores) {
      const val = (c) => Number(scores?.[c] ?? 0);
      const top = getTopColors(scores);
      if (top.length > 1) return []; // the tie already covers the top spots
      const rest = COLOR_ORDER.filter((c) => !top.includes(c));
      const max2 = Math.max(...rest.map(val));
      return rest.filter((c) => val(c) === max2);
    }

    function colorLabel(keys, lang, withLetter = false) {
      return keys
        .map((k) => {
          const p = COLOR_PROFILES[k];
          if (!p) return k;
          return withLetter ? `${p.name[lang]} (${p.letter})` : p.name[lang];
        })
        .join(' / ');
    }

    // =========================================================
    // 6. TEAM SYNC (Google Sheets via Apps Script — private)
    //    Participants only SEND their own result.
    //    Reading the team table needs the facilitator key,
    //    which is checked on the server (Apps Script), not here.
    // =========================================================
    // Everyone can SEE the team scores. Only the facilitator (key) can
    // download the files and delete results.
    function canSeeTeam() {
      return true;
    }

    function canAdmin() {
      return !state.syncUrl || Boolean(state.adminKey);
    }

    function initCloudSync() {
      let savedKey = '';
      try {
        savedKey = sessionStorage.getItem('disc_admin_key') || '';
      } catch (e) {
        /* storage can be blocked inside iframes — fine */
      }
      updateSyncBadge();
      // a remembered key is only a CANDIDATE: facilitator mode starts only after Google confirms it
      if (state.syncUrl) loadTeamFromSheet(savedKey, true);
      setInterval(() => {
        if (state.syncUrl && (state.mainTab === 'team' || state.stage === 'done')) loadTeamFromSheet();
      }, 30000);
    }

    // candidateKey = a key typed by the user (or remembered), NOT yet trusted.
    // It becomes the active facilitator key only after the server accepts it.
    async function loadTeamFromSheet(candidateKey, quiet) {
      if (!state.syncUrl) return;
      state.teamLoading = true;
      try {
        const sep = state.syncUrl.includes('?') ? '&' : '?';
        const keyToTry = candidateKey || state.adminKey;
        const q = keyToTry ? 'key=' + encodeURIComponent(keyToTry) : 'public=1';
        const res = await fetch(state.syncUrl + sep + q);
        const data = await res.json();
        if (data && data.error) {
          // server refused the key: no facilitator powers, ever
          state.adminKey = '';
          state.teamError = quiet ? '' : 'key';
          try { sessionStorage.removeItem('disc_admin_key'); } catch (e) {}
        } else if (Array.isArray(data)) {
          state.teamError = '';
          state.teamLoaded = true;
          if (keyToTry) {
            state.adminKey = keyToTry; // confirmed by the server
            try { sessionStorage.setItem('disc_admin_key', keyToTry); } catch (e) {}
          }
          state.submissions = data
            .filter((r) => r && r[1] && !isNaN(new Date(r[0]).getTime()) && r[4] !== '' && !isNaN(Number(r[4])))
            .map((r, idx) => ({
              id: String(r[9] || 'sheet-' + idx),
              createdAt: new Date(r[0]).getTime(),
              name: String(r[1]),
              dominantColor: r[2] || 'ROUGE',
              secondaryColor: r[3] || 'JAUNE',
              scores: {
                BLEU: Number(r[4] || 0),
                ROUGE: Number(r[5] || 0),
                VERT: Number(r[6] || 0),
                JAUNE: Number(r[7] || 0)
              },
              answers: r[8] || '{}'
            }))
            .reverse();
        }
      } catch (e) {
        console.warn('Team load error:', e);
        state.teamError = 'network';
      }
      state.teamLoading = false;
      animateNext = false;
      // don't wipe the facilitator-key box while someone is typing in it
      const keyBox = document.getElementById('admin-key-input');
      if (!candidateKey && keyBox && (keyBox.value || document.activeElement === keyBox)) return;
      render();
    }

    async function sendRecord(record) {
      state.sendStatus = 'sending';
      render();
      try {
        // text/plain + no-cors = the standard way to POST to Apps Script from any page
        await fetch(state.syncUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            id: record.id,
            name: record.name,
            scores: record.scores,
            dominantColor: record.dominantColor,
            secondaryColor: record.secondaryColor,
            answers: record.answers,
            createdAt: record.createdAt
          })
        });
        state.sendStatus = 'sent';
      } catch (e) {
        console.warn('Send error:', e);
        state.sendStatus = 'failed';
      }
      animateNext = false;
      render();
      setTimeout(loadTeamFromSheet, 1200);
    }

    function buildSendStatusHtml() {
      if (!state.syncUrl || !state.sendStatus) return '';
      const fr = state.lang === 'fr';
      const map = {
        sending: ['bg-slate-50 text-slate-600 border-slate-200', fr ? 'Envoi de votre résultat…' : 'Sending your result…'],
        sent: ['bg-emerald-50 text-emerald-700 border-emerald-200', fr ? '✓ Résultat transmis à l’animateur.' : '✓ Result sent to the facilitator.'],
        failed: ['bg-red-50 text-red-700 border-red-200', fr ? '⚠ Envoi impossible (connexion ?). Gardez votre Excel personnel.' : '⚠ Could not send (connection?). Keep your personal Excel file.']
      };
      const [cls, txt] = map[state.sendStatus] || map.sending;
      const retry =
        state.sendStatus === 'failed'
          ? `<button type="button" onclick="window.app.retrySend()" class="ml-2 underline font-bold cursor-pointer">${fr ? 'Réessayer' : 'Retry'}</button>`
          : '';
      return `<div class="mb-3 px-3 py-2 rounded-xl border text-xs font-semibold ${cls}">${txt}${retry}</div>`;
    }

    function buildTieNoticeHtml(scores) {
      const fr = state.lang === 'fr';
      const top = getTopColors(scores);
      const sec = getSecondColors(scores);
      let msg = '';
      if (top.length > 1) {
        msg = fr
          ? `Égalité pour la première place : ${colorLabel(top, 'fr')}. Vous avez plusieurs couleurs dominantes — lisez chacune de leurs fiches.`
          : `Tie for first place: ${colorLabel(top, 'en')}. You have several dominant colors — read each of their profiles.`;
      } else if (sec.length > 1) {
        msg = fr
          ? `Égalité pour la couleur secondaire : ${colorLabel(sec, 'fr')}.`
          : `Tie for the secondary color: ${colorLabel(sec, 'en')}.`;
      }
      return msg
        ? `<div class="mt-3 px-3 py-2 rounded-xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-900">${msg}</div>`
        : '';
    }

    // =========================================================
    function buildTeamSectionHtml() {
      const lang = state.lang;
      const counts = { BLEU: 0, ROUGE: 0, VERT: 0, JAUNE: 0 };
      state.submissions.forEach((s) => {
        // a tie counts for each tied color
        getTopColors(s.scores).forEach((k) => {
          if (counts[k] !== undefined) counts[k] += 1;
        });
      });

      const summaryCardsHtml = COLOR_ORDER.map((cKey) => {
        const c = COLOR_PROFILES[cKey];
        return `
          <div class="rounded-2xl border p-3.5 flex flex-col justify-between ${c.lightBg}">
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color:${c.hex}"></span>
              <span class="text-xs font-extrabold uppercase text-slate-800">${c.name[lang]} (${c.letter})</span>
            </div>
            <span class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-0.5">${counts[cKey]}</span>
          </div>
        `;
      }).join('');

      let rowsHtml = '';
      if (state.submissions.length === 0) {
        rowsHtml = `
          <div class="p-10 text-center space-y-2">
            <p class="text-sm font-bold text-slate-700">
              ${
                state.syncUrl && !state.teamLoaded
                  ? lang === 'fr' ? 'Chargement des résultats…' : 'Loading results…'
                  : lang === 'fr' ? 'Aucun résultat enregistré pour le moment.' : 'No team results recorded yet.'
              }
            </p>
            <p class="text-xs text-slate-500">
              ${
                lang === 'fr'
                  ? 'Dès qu’un membre termine les 25 questions, sa couleur dominante apparaît ici en direct.'
                  : 'As soon as a team member completes the 25 questions, their dominant color appears here live.'
              }
            </p>
          </div>
        `;
      } else {
        const trs = state.submissions
          .map((row) => {
            const topKeys = getTopColors(row.scores);
            const secKeys = getSecondColors(row.scores);
            const b = row.scores?.BLEU ?? 0;
            const r = row.scores?.ROUGE ?? 0;
            const v = row.scores?.VERT ?? 0;
            const j = row.scores?.JAUNE ?? 0;
            const total = Math.max(b + r + v + j, 1);

            return `
              <tr class="hover:bg-slate-50/90 transition-colors">
                <td class="py-3 px-4 font-bold text-slate-900">${escapeHtml(row.name)}</td>
                <td class="py-3 px-3">
                  <div class="flex flex-wrap items-center gap-1.5">
                    ${topKeys
                      .map(
                        (k) =>
                          `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${COLOR_PROFILES[k].badgeBg}">${COLOR_PROFILES[k].name[lang]} (${COLOR_PROFILES[k].letter})</span>`
                      )
                      .join('')}
                    ${secKeys.length ? `<span class="text-xs text-slate-500 font-medium">+ ${colorLabel(secKeys, lang)}</span>` : ''}
                  </div>
                </td>
                <td class="py-3 px-2 text-center font-bold text-red-700 bg-red-50/40">${r}</td>
                <td class="py-3 px-2 text-center font-bold text-amber-700 bg-amber-50/40">${j}</td>
                <td class="py-3 px-2 text-center font-bold text-green-700 bg-green-50/40">${v}</td>
                <td class="py-3 px-2 text-center font-bold text-blue-700 bg-blue-50/40">${b}</td>
                <td class="py-3 px-4 hidden sm:table-cell w-36">
                  <div class="w-full h-2.5 rounded-full overflow-hidden flex bg-slate-100">
                    <div class="bg-red-600 h-full" style="width:${(r / total) * 100}%"></div>
                    <div class="bg-amber-400 h-full" style="width:${(j / total) * 100}%"></div>
                    <div class="bg-green-600 h-full" style="width:${(v / total) * 100}%"></div>
                    <div class="bg-blue-600 h-full" style="width:${(b / total) * 100}%"></div>
                  </div>
                </td>
                <td class="py-3 px-4 text-right">
                  <div class="inline-flex items-center gap-1">
                    <button
                      type="button"
                      onclick="window.app.openMemberModal('${row.id}')"
                      class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 cursor-pointer"
                    >
                      ${lang === 'fr' ? 'Profil' : 'View'}
                    </button>
                    ${
                      !canAdmin()
                        ? ''
                        : state.confirmDeleteId === row.id
                        ?`<button type="button" onclick="window.app.deleteSubmission('${row.id}')" class="px-2 py-1 rounded-lg bg-red-600 text-white text-xs font-bold cursor-pointer">${
                            lang === 'fr' ? 'Confirmer' : 'Confirm'
                          }</button>`
                        : `<button type="button" onclick="window.app.askDeleteSubmission('${row.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 cursor-pointer" title="Supprimer">✕</button>`
                    }
                  </div>
                </td>
              </tr>
            `;
          })
          .join('');

        rowsHtml = `
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-extrabold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-4">${lang === 'fr' ? 'Participant' : 'Participant'}</th>
                  <th class="py-3 px-3">${lang === 'fr' ? 'Couleur Dominante' : 'Dominant Color'}</th>
                  <th class="py-3 px-2 text-center text-red-600">${lang === 'fr' ? 'Rouge' : 'Red'}</th>
                  <th class="py-3 px-2 text-center text-amber-600">${lang === 'fr' ? 'Jaune' : 'Yellow'}</th>
                  <th class="py-3 px-2 text-center text-green-600">${lang === 'fr' ? 'Vert' : 'Green'}</th>
                  <th class="py-3 px-2 text-center text-blue-600">${lang === 'fr' ? 'Bleu' : 'Blue'}</th>
                  <th class="py-3 px-4 hidden sm:table-cell">${lang === 'fr' ? 'Répartition' : 'Breakdown'}</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                ${trs}
              </tbody>
            </table>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
            <div class="col-span-2 sm:col-span-1 bg-slate-900 text-white rounded-2xl p-3.5 flex flex-col justify-between">
              <span class="text-[11px] font-semibold text-slate-300 uppercase">${lang === 'fr' ? 'Total Équipe' : 'Total Team'}</span>
              <span class="text-2xl sm:text-3xl font-extrabold mt-0.5">${state.submissions.length}</span>
            </div>
            ${summaryCardsHtml}
          </div>

          <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900">
                  ${lang === 'fr' ? 'Résultats de toute l’équipe en direct' : 'Live Team Results'}
                </h2>
                <p class="text-xs text-slate-500">
                  ${
                    !canAdmin()
                      ? lang === 'fr'
                        ? 'Les résultats se mettent à jour automatiquement. Le téléchargement est réservé à l’animateur.'
                        : 'Results update automatically. Downloading is reserved for the facilitator.'
                      : lang === 'fr'
                      ? 'Exportez le tableau complet avec les réponses Q1 à Q25 et les scores couleurs vers Excel.'
                      : 'Export the complete table with Q1–Q25 answers and final color scores to Excel.'
                  }
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                ${canAdmin() ? `<button
                  type="button"
                  onclick="window.app.exportExcelAll()"
                  ${state.submissions.length === 0 && !state.myResult ? 'disabled' : ''}
                  class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 text-white text-xs font-bold shadow-xs transition-all cursor-pointer"
                >
                  <span>📊 ${lang === 'fr' ? 'Exporter Excel (.xls avec Q1–Q25)' : 'Export Excel (.xls with Q1–Q25)'}</span>
                </button>
                <button
                  type="button"
                  onclick="window.app.exportCSVAll()"
                  ${state.submissions.length === 0 && !state.myResult ? 'disabled' : ''}
                  class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 text-white text-xs font-bold cursor-pointer"
                >
                  <span>CSV</span>
                </button>` : ''}
                ${
                  state.syncUrl
                    ? `<button type="button" onclick="window.app.refreshTeam()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer">↻ ${lang === 'fr' ? 'Actualiser' : 'Refresh'}</button>`
                    : ''
                }
                ${
                  state.syncUrl && state.adminKey
                    ? `<button type="button" onclick="window.app.lockTeam()" title="${lang === 'fr' ? 'Quitter le mode animateur' : 'Leave facilitator mode'}" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer">🔒 ${lang === 'fr' ? 'Animateur : actif' : 'Facilitator: on'}</button>`
                    : ''
                }
                ${
                  state.syncUrl && !state.adminKey
                    ? `<div class="flex items-center gap-1.5">
                         <input id="admin-key-input" type="password" autocomplete="off"
                           onkeydown="if(event.key==='Enter') window.app.unlockTeam()"
                           placeholder="🔒 ${lang === 'fr' ? 'Clé animateur' : 'Facilitator key'}"
                           class="w-32 px-2.5 py-2 rounded-xl border ${state.teamError === 'key' ? 'border-red-500' : 'border-slate-300'} text-xs outline-none focus:border-slate-900" />
                         <button type="button" onclick="window.app.unlockTeam()" class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer">OK</button>
                       </div>`
                    : ''
                }
              </div>
            </div>
            ${rowsHtml}
          </div>
        </div>
      `;
    }

    // =========================================================
    // 9. MAIN RENDER FUNCTION
    // =========================================================
    function updateHeaderCounts() {
      const lang = state.lang;
      document.getElementById('nav-quiz-label').textContent = lang === 'fr' ? 'Questionnaire' : 'Questionnaire';
      document.getElementById('nav-team-label').textContent = lang === 'fr' ? 'Équipe' : 'Team';
      document.getElementById('nav-team-count').textContent = canSeeTeam() ? String(state.submissions.length) : '🔒';

      const quizBtn = document.getElementById('tab-btn-quiz');
      const teamBtn = document.getElementById('tab-btn-team');
      if (state.mainTab === 'quiz') {
        quizBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-slate-900 shadow-sm';
        teamBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
      } else {
        teamBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-slate-900 shadow-sm flex items-center gap-1.5';
        quizBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900';
      }

      document.getElementById('lang-btn-fr').className =
        lang === 'fr'
          ? 'px-2 py-1 rounded-lg text-xs font-extrabold transition-all bg-slate-900 text-white'
          : 'px-2 py-1 rounded-lg text-xs font-extrabold transition-all text-slate-500 hover:text-slate-900';
      document.getElementById('lang-btn-en').className =
        lang === 'en'
          ? 'px-2 py-1 rounded-lg text-xs font-extrabold transition-all bg-slate-900 text-white'
          : 'px-2 py-1 rounded-lg text-xs font-extrabold transition-all text-slate-500 hover:text-slate-900';

      updateSyncBadge();
    }

    function updateSyncBadge() {
      const txtEl = document.getElementById('sync-status-text');
      if (!txtEl) return;
      if (state.syncUrl) {
        txtEl.textContent = state.lang === 'fr' ? 'Résultats envoyés à l’animateur' : 'Results sent to the facilitator';
      } else {
        txtEl.textContent = state.lang === 'fr' ? 'Mode local (cet appareil seulement)' : 'Local mode (this device only)';
      }
    }

    let animateNext = true; // set to false for re-renders that should not replay the fade-in

    function render() {
      updateHeaderCounts();
      const root = document.getElementById('app-root');
      const fadeCls = animateNext ? 'animate-fade-in' : '';
      animateNext = true;
      const lang = state.lang;

      if (state.mainTab === 'team') {
        if (!canSeeTeam()) {
          root.innerHTML = `<div class="${fadeCls}">${buildTeamLockHtml()}</div>`;
          return;
        }
        root.innerHTML = `
          <div class="space-y-6 ${fadeCls}">
            ${buildTeamSectionHtml()}
            ${buildDISCGuideHtml(null, null, null, state.guideTab, 'main')}
          </div>
        `;
        return;
      }

      // TAB 1: QUESTIONNAIRE FLOW
      if (state.stage === 'start') {
        const previewCards = COLOR_ORDER.map((cKey) => {
          const c = COLOR_PROFILES[cKey];
          return `
            <div class="rounded-xl border px-3 py-2 flex items-center gap-2 ${c.lightBg}">
              <span class="w-3 h-3 rounded-full shrink-0" style="background-color:${c.hex}"></span>
              <div class="min-w-0">
                <div class="text-xs sm:text-sm font-extrabold text-slate-900 leading-tight">${c.name[lang]} (${c.letter})</div>
                <div class="text-[11px] text-slate-600 leading-tight">${c.roleTitle[lang]}</div>
              </div>
            </div>
          `;
        }).join('');

        root.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-xs p-5 sm:p-8 ${fadeCls}">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-xs font-bold mb-3">
              <span>25 Questions</span>
              <span>•</span>
              <span>~3 min</span>
              <span>•</span>
              <span>FR / EN</span>
            </div>

            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-2">
              ${lang === 'fr' ? 'Test de personnalité DISC aux 4 couleurs' : 'DISC 4-Color Personality Assessment'}
            </h2>
            <p class="text-slate-600 text-xs sm:text-sm mb-5 leading-relaxed">
              ${
                lang === 'fr'
                  ? 'Pour chaque situation, touchez la réponse (a, b, c ou d) qui vous correspond le plus naturellement. À la fin, vous découvrirez l’explication complète de votre couleur ainsi que les résultats de toute l’équipe.'
                  : 'For each situation, tap the option (a, b, c, or d) that best describes you. At the end, you will unlock your complete color profile explanation and see the live team results.'
              }
            </p>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
              ${previewCards}

            <div class="space-y-3.5">
              <div>

                  ${lang === 'fr' ? 'Votre prénom et nom' : 'Your Full Name'}

                <input

                  type="text"
                  value="${escapeHtml(state.name)}"
                  oninput="window.app.updateName(this.value)"

                    state.nameError
                      ? 'border-red-500 bg-red-50 focus:ring-2 focus:ring-red-300'
                      : 'border-slate-300 bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-200'
                  }"
                />
                ${
                  state.nameError
                    ? `<p class="text-xs font-semibold text-red-600 mt-1">${
                        lang === 'fr' ? 'Veuillez entrer votre nom avant de commencer.' : 'Please enter your name before starting.'
                      }</p>`
                    : ''
                }
              </div>

              <button
                type="button"
                onclick="window.app.startQuestions()"
                class="w-full py-3.5 px-6 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-bold text-sm sm:text-base shadow-sm flex items-center justify-center gap-2 transition-all cursor-pointer"
              >
                <span>${lang === 'fr' ? 'Commencer le questionnaire →' : 'Start Questionnaire →'}</span>
              </button>

              <div class="pt-2 border-t border-slate-100 flex justify-center">
                <button
                  type="button"
                  onclick="window.app.startQuickGrid()"

                >
                  <span>${
                    lang === 'fr'
                      ? 'Déjà répondu sur papier ? Saisie rapide (a, b, c, d)'
                      : 'Already answered on paper? Quick Entry (a, b, c, d)'
                  }</span>
                </button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.stage === 'questions') {
        const qObj = QUESTIONS[state.currentQ];
        const answeredCount = Object.keys(state.answers).length;

        const optionsHtml = ['a', 'b', 'c', 'd']
          .map((letter) => {
            const isSelected = state.answers[qObj.id] === letter;
            return `
              <button
                type="button"
                onclick="window.app.selectOption('${letter}')"
                class="w-full text-left p-3 sm:p-4 rounded-2xl border-2 transition-all flex items-start gap-3 cursor-pointer ${
                  isSelected
                    ? 'border-slate-900 bg-slate-900 text-white shadow-sm'
                    : 'border-slate-200 bg-white hover:border-slate-400 hover:bg-slate-50 text-slate-800'

              >
                <span class="w-7 h-7 rounded-xl font-extrabold text-xs uppercase flex items-center justify-center shrink-0 mt-0.5 ${
                  isSelected ? 'bg-white text-slate-900' : 'bg-slate-100 text-slate-700'
                }">
                  ${letter}
                </span>
                <span class="text-sm sm:text-base font-medium leading-snug">
                  ${escapeHtml(qObj.options[letter][lang])}
                </span>
              </button>
            `;
          })
          .join('');

        // Mini 1..25 pill strip for quick jumping
        const dotsHtml = QUESTIONS.map((item, idx) => {
          const done = Boolean(state.answers[item.id]);
          const isCurr = idx === state.currentQ;
          return `
            <button
              type="button"
              onclick="window.app.jumpToQuestion(${idx})"
              class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg text-[11px] sm:text-xs font-bold shrink-0 transition-all cursor-pointer ${
                isCurr
                  ? 'bg-slate-900 text-white ring-2 ring-slate-400'
                  : done
                  ? 'bg-emerald-100 text-emerald-800'
                  : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
              }"
            >
              ${item.id}
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="max-w-2xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-xs p-4 sm:p-7 ${fadeCls}">
            <div class="mb-3">
              <div class="flex items-center justify-between text-xs font-bold text-slate-600 mb-1.5">
                <span>Question ${state.currentQ + 1} / ${QUESTIONS.length}</span>
                <span class="text-slate-500 truncate max-w-[180px]">${escapeHtml(state.name)}</span>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-slate-900 rounded-full transition-all duration-300" style="width:${((state.currentQ + 1) / QUESTIONS.length) * 100}%"></div>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-1.5 py-2 mb-3 border-b border-slate-100">
              ${dotsHtml}

            <h3 class="text-base sm:text-xl font-extrabold text-slate-900 mb-4 leading-snug">

            <div class="space-y-2.5">
              ${optionsHtml}

            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between">

                onclick="window.app.prevQuestion()"

                <span>← ${lang === 'fr' ? 'Précédent' : 'Previous'}</span>
              </button>

              <div class="text-[11px] text-slate-400 font-semibold">
                ${answeredCount} / 25

              ${
                answeredCount === 25
                  ? `<button type="button" onclick="window.app.finishQuiz()" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-xs cursor-pointer">${
                      lang === 'fr' ? 'Voir mon résultat ✓' : 'See My Result ✓'
                    }</button>`
                  : state.answers[qObj.id] && state.currentQ < QUESTIONS.length - 1
                  ? `<button type="button" onclick="window.app.nextQuestion()" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-900 cursor-pointer">${
                      lang === 'fr' ? 'Suivant →' : 'Next →'
                    }</button>`
                  : `<span class="w-16"></span>`
              }
            </div>
          </div>
        `;
        return;
      }

      if (state.stage === 'quickGrid') {
        const answeredCount = Object.keys(state.answers).length;
        const cellsHtml = QUESTIONS.map((q) => {
          const btns = ['a', 'b', 'c', 'd']
            .map((letter) => {
              const active = state.answers[q.id] === letter;
              return `
                <button
                  type="button"
                  onclick="window.app.setQuickGridAnswer(${q.id}, '${letter}')"

                    active
                      ? 'bg-slate-900 text-white shadow-xs'
                      : 'bg-white border border-slate-200 text-slate-700 hover:border-slate-400'
                  }"
                >
                  ${letter}
                </button>
              `;
            })
            .join('');

          return `
            <div class="flex items-center justify-between p-2 rounded-xl border border-slate-200 bg-slate-50">
              <span class="text-xs font-bold text-slate-700 w-8">Q${q.id}.</span>
              <div class="flex items-center gap-1">${btns}</div>
            </div>

        }).join('');

        root.innerHTML = `

            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">

      if (state.stage === 'done' && state.myResult) {
        const res = state.myResult;
        const topSet = getTopColors(res.scores);
        const scoreCardsHtml = res.sortedColors
          .map((cKey, idx) => {
            const c = COLOR_PROFILES[cKey];
            const count = res.scores[cKey] || 0;
            const pct = Math.round((count / 25) * 100);
            return `
              <div class="rounded-2xl border p-3 ${
                topSet.includes(cKey) ? `${c.lightBg} ring-2 ring-slate-900/10` : 'bg-slate-50 border-slate-200'

                <div class="flex items-center justify-between text-xs font-bold mb-1">
                  <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full" style="background-color:${c.hex}"></span>

                <div class="w-full h-2 bg-white rounded-full overflow-hidden border border-black/5">
                  <div class="h-full rounded-full ${c.barColor}" style="width:${Math.max(pct, 4)}%"></div>
                </div>
              </div>
            `;
          })
          .join('');

        root.innerHTML = `
          <div class="space-y-6 ${fadeCls}">
            <!-- 1. Personal Score Summary Card -->
            <div class="bg-white rounded-3xl border border-slate-200 shadow-xs p-4 sm:p-6">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                    type="button"

                    <span>📊 ${lang === 'fr' ? 'Mon Excel (Q1–Q25)' : 'My Excel (Q1–Q25)'}</span>

                    type="button"
                    onclick="window.app.resetQuiz()"
                    class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold cursor-pointer"
                  >
                    <span>↺ ${lang === 'fr' ? 'Nouveau test' : 'New Test'}</span>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

              </div>
              ${buildTieNoticeHtml(res.scores)}

            ${buildDISCGuideHtml(res.scores, res.dominantColor, res.secondaryColor, state.guideTab, 'main')}

            <!-- 3. Team results table (hidden from participants in shared mode) -->
            ${canSeeTeam() ? buildTeamSectionHtml() : ''}
          </div>
        `;
      }
    }

    // =========================================================
    // 10. EXCEL (.XLS) & CSV EXPORT (Includes Q1-Q25 + Final Scores)
    // =========================================================
    function exportExcelRows(rowsToExport, filenamePrefix = 'DISC_Resultats_Equipe') {
      if (!rowsToExport || rowsToExport.length === 0) return;
      const lang = state.lang;

      const qHeaders = Array.from(
        { length: 25 },
        (_, i) =>
          `<th style="background:#1e293b;color:#ffffff;padding:6px 8px;border:1px solid #cbd5e1;">Q${i + 1}</th>`
      ).join('');

      const bodyRows = rowsToExport
        .map((s) => {
          const ansObj = parseAnswers(s.answers);
          const topKeys = getTopColors(s.scores);
          const secKeys = getSecondColors(s.scores);
          const domProf = COLOR_PROFILES[topKeys[0]];
          const b = s.scores?.BLEU ?? 0;
          const r = s.scores?.ROUGE ?? 0;
          const v = s.scores?.VERT ?? 0;
          const j = s.scores?.JAUNE ?? 0;
          const dateStr = s.createdAt ? new Date(s.createdAt).toLocaleString() : '';

          const qCells = Array.from({ length: 25 }, (_, i) => {
            const letter = String(ansObj[i + 1] || '').toUpperCase();
            return `<td style="text-align:center;font-weight:bold;padding:6px;border:1px solid #cbd5e1;">${letter}</td>`;
          }).join('');

          return `
            <tr>
              <td style="font-weight:bold;padding:6px 10px;border:1px solid #cbd5e1;">${escapeHtml(s.name)}</td>
              <td style="font-weight:bold;padding:6px 10px;border:1px solid #cbd5e1;background:${domProf.hex};color:${
            topKeys[0] === 'JAUNE' ? '#0f172a' : '#ffffff'
          };text-align:center;">
                ${colorLabel(topKeys, lang, true)}
              </td>
              <td style="padding:6px 10px;border:1px solid #cbd5e1;text-align:center;">
                ${secKeys.length ? colorLabel(secKeys, lang, true) : '-'}
              </td>
              <td style="text-align:center;font-weight:bold;background:#fef2f2;color:#b91c1c;padding:6px;border:1px solid #cbd5e1;">${r}</td>
              <td style="text-align:center;font-weight:bold;background:#fefce8;color:#a16207;padding:6px;border:1px solid #cbd5e1;">${j}</td>
              <td style="text-align:center;font-weight:bold;background:#f0fdf4;color:#15803d;padding:6px;border:1px solid #cbd5e1;">${v}</td>
              <td style="text-align:center;font-weight:bold;background:#eff6ff;color:#1d4ed8;padding:6px;border:1px solid #cbd5e1;">${b}</td>
              ${qCells}
              <td style="padding:6px 8px;border:1px solid #cbd5e1;color:#64748b;">${dateStr}</td>
            </tr>
          `;
        })
        .join('');

      const htmlExcel = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
          <meta charset="UTF-8" />
          <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Resultats DISC</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
        </head>
        <body>
          <h2 style="font-family:Arial,sans-serif;">DISC Leadership — ${
            lang === 'fr' ? 'Résultats finaux & Réponses (Q1 à Q25)' : 'Final Results & Answers (Q1 to Q25)'
          }</h2>
          <table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:12px;">
            <thead>
              <tr>
                <th style="background:#0f172a;color:#ffffff;padding:8px 12px;border:1px solid #cbd5e1;">Participant</th>
                <th style="background:#0f172a;color:#ffffff;padding:8px 12px;border:1px solid #cbd5e1;">${
                  lang === 'fr' ? 'Couleur Dominante' : 'Dominant Color'
                }</th>
                <th style="background:#0f172a;color:#ffffff;padding:8px 12px;border:1px solid #cbd5e1;">${
                  lang === 'fr' ? 'Couleur Secondaire' : 'Secondary Color'
                }</th>
                <th style="background:#dc2626;color:#ffffff;padding:8px 10px;border:1px solid #cbd5e1;">ROUGE (D) /25</th>
                <th style="background:#eab308;color:#0f172a;padding:8px 10px;border:1px solid #cbd5e1;">JAUNE (I) /25</th>
                <th style="background:#16a34a;color:#ffffff;padding:8px 10px;border:1px solid #cbd5e1;">VERT (S) /25</th>
                <th style="background:#2563eb;color:#ffffff;padding:8px 10px;border:1px solid #cbd5e1;">BLEU (C) /25</th>
                ${qHeaders}
                <th style="background:#0f172a;color:#ffffff;padding:8px 10px;border:1px solid #cbd5e1;">Date</th>
              </tr>
            </thead>
            <tbody>
              ${bodyRows}
            </tbody>
          </table>
        </body>
        </html>
      `;

      const blob = new Blob(['\uFEFF' + htmlExcel], {
        type: 'application/vnd.ms-excel;charset=utf-8;'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${filenamePrefix}_${new Date().toISOString().slice(0, 10)}.xls`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
    }

    // =========================================================
    // 11. PUBLIC CONTROLLER METHODS (Exposed on window.app)
    // =========================================================
    window.app = {
      setLanguage(newLang) {
        state.lang = newLang;
        render();
        if (state.inspectingMember) {
          this.renderMemberModalContent();
        }
      },

      switchMainTab(tab) {
        state.mainTab = tab;
        render();
      },

      updateName(val) {
        state.name = val;
        if (state.nameError && val.trim()) {
          state.nameError = false;
          render();
          const input = document.getElementById('participant-name-input');
          if (input) {
            input.focus();
            input.setSelectionRange(val.length, val.length);
          }
        }
      },

      startQuestions() {
        if (!state.name.trim()) {
          state.nameError = true;
          render();
          return;
        }
        state.currentQ = 0;
        state.stage = 'questions';
        render();
      },

      startQuickGrid() {
        if (!state.name.trim()) {
          state.nameError = true;
          render();
          return;
        }
        state.stage = 'quickGrid';
        render();
      },

      backToStart() {
        state.stage = 'start';
        render();
      },

      selectOption(letter) {
        const qId = QUESTIONS[state.currentQ].id;
        state.answers[qId] = letter;
        animateNext = false; // just highlight the choice, no flicker
        render();

        setTimeout(() => {
          if (state.stage !== 'questions') return;
          if (state.currentQ < QUESTIONS.length - 1) {
            state.currentQ += 1;
            render();
            if (window.scrollY > 60) window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            // last question: finish only if all 25 are answered, else go to the first gap
            this.finishQuiz();
          }
        }, 280);
      },

      prevQuestion() {
        if (state.currentQ > 0) {
          state.currentQ -= 1;
        } else {
          state.stage = 'start';
        }
        render();
      },

      nextQuestion() {
        if (state.currentQ < QUESTIONS.length - 1) {
          state.currentQ += 1;
          render();
        }
      },

      jumpToQuestion(idx) {
        state.currentQ = idx;
        render();
      },

      setQuickGridAnswer(qId, letter) {
        state.answers[qId] = letter;
        animateNext = false;
        render();
      },

      async finishQuiz() {
        if (state.stage === 'done') return; // prevents double submission
        // All 25 answers are required so the 4 totals always add up to 25
        const missing = QUESTIONS.findIndex((q) => !state.answers[q.id]);
        if (missing !== -1) {
          if (state.stage === 'questions') {
            state.currentQ = missing;
            render();
          }
          return;
        }

        const cleanName = state.name.trim() || 'Participant';
        const evaluation = evaluateDISC(state.answers);
        const record = {
          id: 'local-' + Date.now(),
          name: cleanName,
          scores: evaluation.scores,
          dominantColor: evaluation.dominantColor,
          secondaryColor: evaluation.secondaryColor,
          sortedColors: evaluation.sortedColors,
          answers: JSON.stringify(state.answers),
          createdAt: Date.now()
        };

        state.myResult = record;
        state.guideTab = evaluation.dominantColor;
        state.stage = 'done';
        state.sendStatus = '';

        if (state.syncUrl) {
          // Shared mode: send to the facilitator's Google Sheet (private)
          sendRecord(record);
        } else {
          // Local mode: this device only
          state.submissions = [record, ...state.submissions];
          render();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      resetQuiz() {
        state.name = '';
        state.answers = {};
        state.currentQ = 0;
        state.myResult = null;
        state.sendStatus = '';
        state.stage = 'start';
        render();
      },

      setGuideTab(tabKey, modePrefix = 'main') {
        if (modePrefix === 'modal') {
          state.modalGuideTab = tabKey;
          this.renderMemberModalContent();
        } else {
          state.guideTab = tabKey;
          render();
        }
      },

      openMemberModal(rowId) {
        const found = state.submissions.find((s) => s.id === rowId);
        if (!found) return;
        state.inspectingMember = found;
        state.modalGuideTab = found.dominantColor || 'ROUGE';
        const modal = document.getElementById('member-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        this.renderMemberModalContent();
      },

      renderMemberModalContent() {
        const m = state.inspectingMember;
        if (!m) return;
        document.getElementById('modal-member-name').textContent = m.name;
        document.getElementById('modal-member-subtitle').textContent =
          state.lang === 'fr' ? 'Profil DISC détaillé' : 'Detailed DISC Profile';
        document.getElementById('modal-member-excel-btn').style.display = canAdmin() ? '' : 'none';
        document.getElementById('modal-member-excel-btn').onclick = () => {
          exportExcelRows([m], `DISC_${(m.name || 'Participant').replace(/\s+/g, '_')}`);
        };
        document.getElementById('modal-member-body').innerHTML = buildDISCGuideHtml(
          m.scores,
          m.dominantColor,
          m.secondaryColor,
          state.modalGuideTab,
          'modal'
        );
      },

      closeMemberModal() {
        state.inspectingMember = null;
        const modal = document.getElementById('member-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      },

      askDeleteSubmission(rowId) {
        state.confirmDeleteId = rowId;
        render();
      },

      async deleteSubmission(rowId) {
        state.confirmDeleteId = null;
        state.submissions = state.submissions.filter((s) => s.id !== rowId);
        render();
        // Protected mode: the server checks the facilitator key before deleting
        if (state.syncUrl && state.adminKey && !String(rowId).startsWith('sheet-')) {
          try {
            await fetch(state.syncUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'delete', key: state.adminKey, id: rowId })
            });
          } catch (e) {
            console.warn('Delete error:', e);
          }
          setTimeout(loadTeamFromSheet, 1500);
        }
      },

      exportExcelAll() {
        const list =
          state.submissions.length > 0
            ? state.submissions
            : state.myResult
            ? [state.myResult]
            : [];
        exportExcelRows(list, 'DISC_Resultats_Equipe_Complet');
      },

      exportExcelSingle() {
        if (!state.myResult) return;
        exportExcelRows([state.myResult], `DISC_${state.myResult.name.replace(/\s+/g, '_')}`);
      },

      exportCSVAll() {
        const rowsToExport =
          state.submissions.length > 0
            ? state.submissions
            : state.myResult
            ? [state.myResult]
            : [];
        if (rowsToExport.length === 0) return;

        const lang = state.lang;
        const qCols = Array.from({ length: 25 }, (_, i) => `Q${i + 1}`);
        const headers = [
          'Name',
          'Dominant_Color',
          'Secondary_Color',
          'ROUGE_D',
          'JAUNE_I',
          'VERT_S',
          'BLEU_C',
          ...qCols,
          'Date'
        ];

        const csvRows = rowsToExport.map((s) => {
          const ansObj = parseAnswers(s.answers);
          const domName = colorLabel(getTopColors(s.scores), lang);
          const secKeysCsv = getSecondColors(s.scores);
          const secName = secKeysCsv.length ? colorLabel(secKeysCsv, lang) : '-';
          const qVals = Array.from({ length: 25 }, (_, i) =>
            String(ansObj[i + 1] || '').toUpperCase()
          );
          const dateStr = s.createdAt ? new Date(s.createdAt).toLocaleString() : '';

          return [
            `"${String(s.name || '').replace(/"/g, '""')}"`,
            domName,
            secName,
            s.scores?.ROUGE ?? 0,
            s.scores?.JAUNE ?? 0,
            s.scores?.VERT ?? 0,
            s.scores?.BLEU ?? 0,
            ...qVals,
            `"${dateStr}"`
          ].join(',');
        });

        const csv = '\uFEFF' + [headers.join(','), ...csvRows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DISC_Results_Q1_Q25_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);
      },

      unlockTeam() {
        const input = document.getElementById('admin-key-input');
        const key = input ? input.value.trim() : '';
        if (!key) return;
        // do NOT switch anything on yet: ask Google first
        state.teamError = '';
        loadTeamFromSheet(key);
      },

      lockTeam() {
        // leave facilitator mode but KEEP the list on screen, then refresh it quietly
        state.adminKey = '';
        state.teamError = '';
        try { sessionStorage.removeItem('disc_admin_key'); } catch (e) {}
        animateNext = false;
        render();
        loadTeamFromSheet();
      },

      refreshTeam() {
        loadTeamFromSheet();
      },

      retrySend() {
        if (state.myResult && state.syncUrl) sendRecord(state.myResult);
      }
    };

    // Start app immediately on load
    render();
    initCloudSync();
  </script>
</body>
</html>
